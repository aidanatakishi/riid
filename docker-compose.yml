services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      FLASK_DEBUG: "false"
      TRUST_PROXY: "true"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/health' % os.environ.get('PORT','5000'))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
